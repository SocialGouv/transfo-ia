<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="846" viewBox="0 0 1120 846" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#006300"/></marker><marker id="arr-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42323"/></marker><marker id="arr-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a35d00"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="844" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Exemple d'orchestration pour /plan-tech : plan et revue d'impact</text><rect x="593.5" y="20.0" width="92.8" height="20.0" rx="6" fill="#1c5cab"/><text x="639.9" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DÉVELOPPEUR</text><text x="24.0" y="56.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Du ticket au plan d'implémentation : l'agent architecte lit le ticket, les maquettes et le code, la règle vérifie que le plan est exécutable, un second agent mesure</text><text x="24.0" y="73.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">l'impact sur l'existant, le développeur tranche et valide.</text><rect x="24.0" y="133.0" width="92.0" height="175.0" rx="10" fill="#1c5cab"/><text x="70.0" y="218.5" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="234.5" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="127.0" width="980.0" height="187.0" rx="8" fill="#f5f5f2"/><rect x="24.0" y="356.0" width="92.0" height="130.5" rx="10" fill="#006300"/><text x="70.0" y="419.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="435.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><rect x="124.0" y="350.0" width="980.0" height="142.5" rx="8" fill="#f5f5f2"/><rect x="24.0" y="534.5" width="92.0" height="147.0" rx="10" fill="#a35d00"/><text x="70.0" y="606.0" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="622.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="528.5" width="980.0" height="159.0" rx="8" fill="#f5f5f2"/><path d="M199.8,583.2 L199.8,274.0" fill="none" stroke="#a35d00" stroke-width="1.6" marker-end="url(#arr-amb)"/><path d="M265.7,220.5 L297.7,220.5" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M349.5,306.2 L349.5,567.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr-n)"/><text x="342.5" y="440.6" font-size="10.5" fill="#52514e" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">questions</text><path d="M381.5,569.0 L381.5,308.2" fill="none" stroke="#a35d00" stroke-width="1.6" marker-end="url(#arr-amb)"/><text x="388.5" y="442.6" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">réponses</text><path d="M431.3,220.5 L448.3,220.5 L448.3,421.2 L463.3,421.2" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M465.3,421.2 L439.3,421.2 L439.3,101.0 L365.5,101.0 L365.5,132.8" fill="none" stroke="#b42323" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="402.4" y="96.0" font-size="10.5" fill="#b42323" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">plan incomplet : le motif repart à l'architecte · 3 essais au plus</text><path d="M531.2,486.5 L531.2,561.0" fill="none" stroke="#b42323" stroke-width="1.6" marker-end="url(#arr-ko)"/><path d="M597.0,421.2 L614.0,421.2 L614.0,220.5 L629.0,220.5" fill="none" stroke="#006300" stroke-width="1.6" marker-end="url(#arr-ok)"/><text x="620.0" y="324.9" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">conforme</text><path d="M762.7,220.5 L779.7,220.5 L779.7,608.0 L794.7,608.0" fill="none" stroke="#006300" stroke-width="1.6" marker-end="url(#arr-ok)"/><path d="M862.5,681.5 L862.5,705.5 L282.7,705.5 L282.7,233.5 L297.7,233.5" fill="none" stroke="#a35d00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="572.6" y="700.5" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">non : la remarque repart à l'architecte, le plan reste éditable</text><path d="M928.3,608.0 L945.3,608.0 L945.3,220.5 L960.3,220.5" fill="none" stroke="#a35d00" stroke-width="1.6" marker-end="url(#arr-amb)"/><text x="951.3" y="418.2" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#fcfcfb" stroke-width="3.5" stroke-linejoin="round">oui</text><path d="M134.0,169.0 h121.66666666666666 l10,10 v93.0 h-131.66666666666666 z" fill="#fcfcfb" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M255.66666666666663,169.0 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="144.0" y="190.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Le ticket et les</text><text x="144.0" y="205.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">maquettes</text><text x="144.0" y="222.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ticket Jira,</text><text x="144.0" y="235.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">maquettes Figma</text><rect x="144.0" y="245.0" width="42.4" height="18.0" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="165.2" y="258.0" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Jira</text><rect x="191.4" y="245.0" width="49.0" height="18.0" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="215.9" y="258.0" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Figma</text><rect x="134.0" y="583.2" width="131.7" height="49.5" rx="9" fill="#fbf1e1"/><text x="144.0" y="604.2" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">Lance /plan-tech</text><text x="144.0" y="621.2" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">sur le ticket</text><rect x="299.7" y="134.8" width="131.7" height="171.5" rx="9" fill="#edf2fb"/><rect x="299.7" y="142.8" width="3" height="155.5" rx="1.5" fill="#1c5cab"/><text x="313.7" y="155.8" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Agent architecte</text><circle cx="316.7" cy="168.8" r="1.8" fill="#0b0b0b"/><text x="322.7" y="172.8" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Lit le ticket, les</text><text x="322.7" y="186.2" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">maquettes, le code</text><circle cx="316.7" cy="195.8" r="1.8" fill="#0b0b0b"/><text x="322.7" y="199.8" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Écrit le plan</text><text x="322.7" y="213.2" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">d'implémentation,</text><text x="322.7" y="226.8" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">phase par phase</text><text x="313.7" y="243.8" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : standards</text><text x="313.7" y="256.8" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">de développement ·</text><text x="313.7" y="269.8" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">sécurité au besoin</text><rect x="313.7" y="279.2" width="42.4" height="18.0" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="334.9" y="292.2" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Jira</text><rect x="361.1" y="279.2" width="49.0" height="18.0" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="385.6" y="292.2" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Figma</text><rect x="415.1" y="279.2" width="42.4" height="18.0" rx="9" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="436.3" y="292.2" font-size="10.5" fill="#2a78d6" font-weight="600" text-anchor="middle">DSFR</text><rect x="299.7" y="569.0" width="131.7" height="78.0" rx="9" fill="#fbf1e1"/><text x="309.7" y="590.0" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">Tranche les</text><text x="309.7" y="605.0" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">choix techniques</text><text x="309.7" y="622.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">quand l'agent le</text><text x="309.7" y="635.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">demande</text><rect x="465.3" y="356.0" width="131.7" height="130.5" rx="9" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="475.3" y="377.0" font-size="12" fill="#006300" font-weight="600" text-anchor="start">Contrôle du plan</text><circle cx="478.3" cy="390.0" r="1.8" fill="#0b0b0b"/><text x="484.3" y="394.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Chaque phase a ses</text><text x="484.3" y="407.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">fichiers, sa</text><text x="484.3" y="421.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">commande de</text><text x="484.3" y="434.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">vérification, un</text><text x="484.3" y="448.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">identifiant unique</text><circle cx="478.3" cy="457.5" r="1.8" fill="#0b0b0b"/><text x="484.3" y="461.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Lisible par la</text><text x="484.3" y="475.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">machine</text><rect x="465.3" y="563.0" width="131.7" height="90.0" rx="9" fill="#fcfcfb" stroke="#b42323" stroke-width="1" stroke-dasharray="4 3"/><text x="475.3" y="584.0" font-size="12" fill="#b42323" font-weight="600" text-anchor="start">Reprend la main</text><text x="475.3" y="601.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">3 échecs :</text><text x="475.3" y="614.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'orchestration</text><text x="475.3" y="628.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">s'arrête, le travail</text><text x="475.3" y="641.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">en cours reste</text><rect x="631.0" y="133.0" width="131.7" height="175.0" rx="9" fill="#edf2fb"/><rect x="631.0" y="141.0" width="3" height="159.0" rx="1.5" fill="#1c5cab"/><text x="645.0" y="151.0" font-size="9.5" fill="#2a78d6" font-weight="600" text-anchor="start" letter-spacing="0.06em">CONTEXTE VIERGE</text><text x="645.0" y="167.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Agent revue</text><text x="645.0" y="182.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">d'impact</text><circle cx="648.0" cy="195.0" r="1.8" fill="#0b0b0b"/><text x="654.0" y="199.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Croise le plan et</text><text x="654.0" y="212.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">le code existant</text><circle cx="648.0" cy="222.0" r="1.8" fill="#0b0b0b"/><text x="654.0" y="226.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Liste ce qui va</text><text x="654.0" y="239.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">casser :</text><text x="654.0" y="253.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">comportements,</text><text x="654.0" y="266.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">tests</text><text x="645.0" y="283.5" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : le plan,</text><text x="645.0" y="296.5" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">le code</text><rect x="796.7" y="534.5" width="131.7" height="147.0" rx="14" fill="#fbf1e1" stroke="#a35d00" stroke-width="1"/><text x="806.7" y="555.5" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">Valide le plan</text><text x="806.7" y="570.5" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">et les casses</text><text x="806.7" y="585.5" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">annoncées ?</text><text x="806.7" y="602.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">oui : la revue</text><text x="806.7" y="616.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">d'impact fait foi</text><text x="806.7" y="629.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">pour /implementation</text><text x="806.7" y="643.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">non : le plan est</text><text x="806.7" y="656.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">corrigé, à la main</text><text x="806.7" y="670.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">ou par l'agent</text><path d="M962.3,167.2 L1092.0,167.2 L1104.0,220.5 L1092.0,273.8 L962.3,273.8 Z" fill="#0d366b"/><text x="972.3" y="188.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Plan + revue</text><text x="972.3" y="203.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">d'impact</text><text x="972.3" y="218.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">approuvés</text><text x="972.3" y="235.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">prêts pour</text><text x="972.3" y="248.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">/implementation,</text><text x="972.3" y="262.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">back et front</text><rect x="24.0" y="749.5" width="26.0" height="15.0" rx="4" fill="#edf2fb"/><rect x="24.0" y="752.5" width="3" height="9" rx="1.5" fill="#1c5cab"/><text x="60.0" y="761.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne</text><rect x="467.0" y="749.5" width="26.0" height="15.0" rx="4" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="503.0" y="761.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">la règle prouve : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="24.0" y="770.5" width="26.0" height="15.0" rx="7" fill="#fbf1e1" stroke="#a35d00" stroke-width="1"/><text x="60.0" y="782.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M439.5,778.0 L465.5,778.0" stroke="#006300" stroke-width="1.6" fill="none" marker-end="url(#arr-ok)"/><text x="475.5" y="782.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ça passe</text><path d="M541.5,778.0 L567.5,778.0" stroke="#b42323" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="577.5" y="782.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,799.0 L50,799.0" stroke="#a35d00" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="60.0" y="803.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M417.5,791.5 h16 l10,10 v5 h-26 z" fill="#fcfcfb" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M433.5,791.5 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="453.5" y="803.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M541.5,791.5 L559.5,791.5 L571.5,799.0 L559.5,806.5 L541.5,806.5 Z" fill="#0d366b"/><text x="577.5" y="803.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="827.5" font-size="11" fill="#898781" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>