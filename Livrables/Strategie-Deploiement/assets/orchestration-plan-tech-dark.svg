ll="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="127.0" width="980.0" height="183.5" rx="8" fill="#232322"/><rect x="24.0" y="352.5" width="92.0" height="117.0" rx="10" fill="#006300"/><text x="70.0" y="402.0" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="418.0" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><text x="70.0" y="432.0" font-size="10" fill="#fff" font-weight="normal" text-anchor="middle">déterministe</text><rect x="124.0" y="346.5" width="980.0" height="129.0" rx="8" fill="#232322"/><rect x="24.0" y="517.5" width="92.0" height="147.0" rx="10" fill="#fab219"/><text x="70.0" y="589.0" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="605.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="511.5" width="980.0" height="159.0" rx="8" fill="#232322"/><path d="M216.4,566.2 L216.4,272.2" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-tech-amb)"/><path d="M298.8,218.8 L330.8,218.8" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-tech-n)"/><path d="M399.2,304.5 L399.2,556.8" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-tech-n)"/><rect x="333.4" y="424.1" width="62.8" height="14.5" rx="3" fill="#1a1a19"/><text x="392.2" y="434.6" font-size="10.5" fill="#c3c2b7" font-weight="600" text-anchor="end">questions</text><path d="M431.2,558.8 L431.2,306.5" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-tech-amb)"/><rect x="434.2" y="426.1" width="56.7" height="14.5" rx="3" fill="#1a1a19"/><text x="438.2" y="436.6" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start">réponses</text><path d="M497.6,218.8 L514.6,218.8 L514.6,411.0 L529.6,411.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-tech-n)"/><path d="M531.6,411.0 L505.6,411.0 L505.6,101.0 L415.2,101.0 L415.2,131.0" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-plan-tech-ko)"/><rect x="255.4" y="85.5" width="409.9" height="14.5" rx="3" fill="#1a1a19"/><text x="460.4" y="96.0" font-size="10.5" fill="#f07070" font-weight="600" text-anchor="middle">plan incomplet : le motif repart à l'architecte · 3 essais au plus</text><path d="M614.0,469.5 L614.0,544.0" fill="none" stroke="#f07070" stroke-width="1.6" marker-end="url(#arr-plan-tech-ko)"/><path d="M696.4,411.0 L713.4,411.0 L713.4,218.8 L728.4,218.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-plan-tech-ok)"/><rect x="715.4" y="308.4" width="56.7" height="14.5" rx="3" fill="#1a1a19"/><text x="719.4" y="318.9" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start">conforme</text><path d="M895.2,218.8 L912.2,218.8 L912.2,591.0 L927.2,591.0" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-plan-tech-ok)"/><path d="M1011.6,664.5 L1011.6,688.5 L315.8,688.5 L315.8,231.8 L330.8,231.8" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-plan-tech-amb)"/><rect x="467.9" y="673.0" width="391.7" height="14.5" rx="3" fill="#1a1a19"/><text x="663.7" y="683.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="middle">non : la remarque repart à l'architecte, le plan reste éditable</text><path d="M1094.0,591.0 L1011.6,591.0 L1011.6,218.8 L927.2,218.8" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-tech-amb)"/><rect x="1013.6" y="398.4" width="26.3" height="14.5" rx="3" fill="#1a1a19"/><text x="1017.6" y="408.9" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start">oui</text><path d="M134,167.25 h154.8 l10,10 v93.0 h-164.8 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M288.8,167.25 v10 h10" fill="none" stroke="#c3c2b7" stroke-widt