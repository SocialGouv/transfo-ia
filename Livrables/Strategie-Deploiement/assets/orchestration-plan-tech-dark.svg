</text><circle cx="37.0" cy="740.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="37.0" y="744.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="60.0" y="744.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">1, 2, 3… l'ordre des étapes quand tout se passe bien</text><rect x="379.4" y="732.5" width="26.0" height="15.0" rx="4" fill="#20242c"/><rect x="379.4" y="735.5" width="3" height="9" rx="1.5" fill="#2565bd"/><text x="415.4" y="744.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne ; un second agent qui relit = boucle IA</text><rect x="24.0" y="753.5" width="26.0" height="15.0" rx="4" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="60.0" y="765.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">la règle prouve = boucle déterministe : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="614.0" y="753.5" width="26.0" height="15.0" rx="7" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="650.0" y="765.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M24,782.0 L50,782.0" stroke="#0ca30c" stroke-width="1.6" fill="none" marker-end="url(#arr-plan-tech-ok)"/><text x="60.0" y="786.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ça passe</text><path d="M127.76,782.0 L153.76,782.0" stroke="#f07070" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-plan-tech-ko)"/><text x="163.8" y="786.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,803.0 L50,803.0" stroke="#fab219" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-plan-tech-amb)"/><text x="60.0" y="807.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M430.92,795.5 h16 l10,10 v5 h-26 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M446.92,795.5 v10 h10" fill="none" stroke="#c3c2b7" stroke-width="1.2"/><text x="466.9" y="807.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M557.6,795.5 L575.6,795.5 L587.6,803.0 L575.6,810.5 L557.6,810.5 Z" fill="#123f77"/><text x="593.6" y="807.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="831.5" font-size="11" fill="#c3c2b7" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>
