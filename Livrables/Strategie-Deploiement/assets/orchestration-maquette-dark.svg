<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="794" viewBox="0 0 1120 794" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-maquette-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arr-maquette-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/></marker><marker id="arr-maquette-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="arr-maquette-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="794" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#ffffff" font-weight="600" text-anchor="start">Exemple d'orchestration pour /maquette : du prototype validé à Figma</text><rect x="649.3" y="20.0" width="72.4" height="20.0" rx="6" fill="#2565bd"/><text x="685.5" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DESIGNER</text><text x="24.0" y="56.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">Du prototype validé aux maquettes Figma : l'agent pousse le prototype dans Figma, la règle vérifie que chaque composant vient de la bibliothèque DSFR officielle,</text><text x="24.0" y="73.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">un second agent contrôle la fidélité, le designer valide.</text><rect x="24.0" y="133.0" width="92.0" height="158.5" rx="10" fill="#2565bd"/><text x="70.0" y="210.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="226.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="127.0" width="980.0" height="170.5" rx="8" fill="#232322"/><rect x="24.0" y="339.5" width="92.0" height="117.0" rx="10" fill="#006300"/><text x="70.0" y="389.0" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="405.0" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><text x="70.0" y="419.0" font-size="10" fill="#fff" font-weight="normal" text-anchor="middle">déterministe</text><rect x="124.0" y="333.5" width="980.0" height="129.0" rx="8" fill="#232322"/><rect x="24.0" y="504.5" width="92.0" height="105.0" rx="10" fill="#fab219"/><text x="70.0" y="555.0" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="571.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="498.5" width="980.0" height="117.0" rx="8" fill="#232322"/><path d="M216.4,532.2 L216.4,239.0" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-maquette-amb)"/><path d="M298.8,212.2 L330.8,212.2" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-maquette-n)"/><path d="M399.2,291.5 L399.2,337.5" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-maquette-n)"/><path d="M431.2,339.5 L431.2,293.5" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-maquette-ko)"/><rect x="438.2" y="306.5" width="56.8" height="17.0" rx="8" fill="#1a1a19" stroke="#f07070" stroke-width="1"/><text x="466.6" y="319.0" font-size="9.5" fill="#f07070" font-weight="600" text-anchor="middle">3 essais</text><path d="M415.2,456.5 L415.2,510.0" fill="none" stroke="#f07070" stroke-width="1.6" marker-end="url(#arr-maquette-ko)"/><path d="M497.6,398.0 L514.6,398.0 L514.6,212.2 L529.6,212.2" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-maquette-ok)"/><rect x="516.6" y="298.6" width="56.7" height="14.5" rx="3" fill="#1a1a19"/><text x="520.6" y="309.1" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start">conforme</text><path d="M614.0,139.0 L614.0,101.0 L415.2,101.0 L415.2,131.0" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-maquette-ko)"/><rect x="337.0" y="85.5" width="355.1" height="14.5" rx="3" fill="#1a1a19"/><text x="514.6" y="96.0" font-size="10.5" fill="#f07070" font-weight="600" text-anchor="middle">refusé : le motif repart au maquetteur · 3 essais au plus</text><path d="M696.4,212.2 L713.4,212.2 L713.4,557.0 L728.4,557.0" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-maquette-ok)"/><rect x="715.4" y="378.1" width="20.2" height="14.5" rx="3" fill="#1a1a19"/><text x="719.4" y="388.6" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start">OK</text><path d="M812.8,609.5 L812.8,633.5 L315.8,633.5 L315.8,225.2 L330.8,225.2" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-maquette-amb)"/><rect x="335.0" y="618.0" width="458.7" height="14.5" rx="3" fill="#1a1a19"/><text x="564.3" y="628.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="middle">non : sa remarque repart à l'agent maquetteur, la version précédente reste</text><path d="M895.2,557.0 L912.2,557.0 L912.2,212.2 L927.2,212.2" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-maquette-amb)"/><rect x="914.2" y="378.1" width="26.3" height="14.5" rx="3" fill="#1a1a19"/><text x="918.2" y="388.6" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start">oui</text><path d="M134,187.5 h154.8 l10,10 v39.5 h-164.8 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M288.8,187.5 v10 h10" fill="none" stroke="#c3c2b7" stroke-width="1.2"/><text x="144.0" y="208.5" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Le prototype validé</text><text x="144.0" y="225.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">par les utilisateurs</text><rect x="134.0" y="532.2" width="164.8" height="49.5" rx="9" fill="#2a2418"/><text x="144.0" y="553.2" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Lance /maquette</text><text x="144.0" y="570.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">sur le prototype</text><circle cx="135.0" cy="533.2" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="135.0" y="537.2" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="332.8" y="133.0" width="164.8" height="158.5" rx="9" fill="#20242c"/><rect x="332.8" y="141.0" width="3" height="142.5" rx="1.5" fill="#2565bd"/><text x="346.8" y="154.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent maquetteur</text><circle cx="349.8" cy="167.0" r="1.8" fill="#ffffff"/><text x="355.8" y="171.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Pousse le prototype</text><text x="355.8" y="184.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">dans Figma</text><circle cx="349.8" cy="194.0" r="1.8" fill="#ffffff"/><text x="355.8" y="198.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Génère les maquettes</text><text x="355.8" y="211.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">en composants DSFR</text><text x="355.8" y="225.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">officiels</text><text x="346.8" y="242.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">contexte : consigne :</text><text x="346.8" y="255.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">composants DSFR officiels</text><rect x="346.8" y="264.5" width="49.0" height="18.0" rx="9" fill="#1a1a19" stroke="#3987e5" stroke-width="1"/><text x="371.3" y="277.5" font-size="10.5" fill="#3987e5" font-weight="600" text-anchor="middle">Figma</text><circle cx="333.8" cy="134.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="333.8" y="138.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="332.8" y="339.5" width="164.8" height="117.0" rx="9" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="342.8" y="360.5" font-size="12" fill="#0ca30c" font-weight="600" text-anchor="start">Gardes-fous</text><circle cx="345.8" cy="373.5" r="1.8" fill="#ffffff"/><text x="351.8" y="377.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Chaque composant vient</text><text x="351.8" y="391.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">de la bibliothèque DSFR</text><text x="351.8" y="404.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">officielle, rien de</text><text x="351.8" y="418.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">redessiné</text><circle cx="345.8" cy="427.5" r="1.8" fill="#ffffff"/><text x="351.8" y="431.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Chaque écran du</text><text x="351.8" y="445.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">prototype a sa maquette</text><circle cx="333.8" cy="340.5" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="333.8" y="344.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="332.8" y="512.0" width="164.8" height="90.0" rx="9" fill="#1a1a19" stroke="#f07070" stroke-width="1" stroke-dasharray="4 3"/><text x="342.8" y="533.0" font-size="12" fill="#f07070" font-weight="600" text-anchor="start">Reprend la main</text><text x="342.8" y="550.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">3 échecs :</text><text x="342.8" y="563.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'orchestration</text><text x="342.8" y="577.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">s'arrête, le travail en</text><text x="342.8" y="590.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">cours reste</text><rect x="531.6" y="139.0" width="164.8" height="146.5" rx="9" fill="#20242c"/><rect x="531.6" y="147.0" width="3" height="130.5" rx="1.5" fill="#2565bd"/><text x="545.6" y="157.0" font-size="9.5" fill="#3987e5" font-weight="600" text-anchor="start" letter-spacing="0.06em">BOUCLE IA · CONTEXTE VIERGE</text><text x="545.6" y="173.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent vérificateur</text><circle cx="548.6" cy="186.0" r="1.8" fill="#ffffff"/><text x="554.6" y="190.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Les maquettes</text><text x="554.6" y="203.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">sont-elles fidèles au</text><text x="554.6" y="217.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">prototype ?</text><circle cx="548.6" cy="226.5" r="1.8" fill="#ffffff"/><text x="554.6" y="230.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Design system respecté</text><text x="554.6" y="244.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">à la lettre ?</text><text x="545.6" y="261.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">contexte : le prototype</text><text x="545.6" y="274.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">et les maquettes</text><circle cx="532.6" cy="140.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="532.6" y="144.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="730.4" y="504.5" width="164.8" height="105.0" rx="14" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="740.4" y="525.5" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Valide les</text><text x="740.4" y="540.5" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">maquettes ?</text><text x="740.4" y="557.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">oui : transmises au</text><text x="740.4" y="571.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">développeur</text><text x="740.4" y="584.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">non : sa remarque repart</text><text x="740.4" y="598.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">à l'agent</text><circle cx="731.4" cy="505.5" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="731.4" y="509.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><path d="M929.2,160.8 L1092.0,160.8 L1104.0,212.2 L1092.0,263.8 L929.2,263.8 Z" fill="#123f77"/><text x="939.2" y="181.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Maquettes Figma</text><text x="939.2" y="196.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">validées</text><text x="939.2" y="213.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">conformes DSFR, lues par</text><text x="939.2" y="227.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">/plan-tech</text><rect x="939.2" y="236.8" width="49.0" height="18.0" rx="9" fill="none" stroke="#ffffff" stroke-width="1"/><text x="963.7" y="249.8" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">Figma</text><circle cx="930.2" cy="161.8" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="930.2" y="165.8" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><circle cx="37.0" cy="685.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="37.0" y="689.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="60.0" y="689.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">1, 2, 3… l'ordre des étapes quand tout se passe bien</text><rect x="379.4" y="677.5" width="26.0" height="15.0" rx="4" fill="#20242c"/><rect x="379.4" y="680.5" width="3" height="9" rx="1.5" fill="#2565bd"/><text x="415.4" y="689.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne ; un second agent qui relit = boucle IA</text><rect x="24.0" y="698.5" width="26.0" height="15.0" rx="4" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="60.0" y="710.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">la règle prouve = boucle déterministe : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="614.0" y="698.5" width="26.0" height="15.0" rx="7" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="650.0" y="710.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M24,727.0 L50,727.0" stroke="#0ca30c" stroke-width="1.6" fill="none" marker-end="url(#arr-maquette-ok)"/><text x="60.0" y="731.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ça passe</text><path d="M127.76,727.0 L153.76,727.0" stroke="#f07070" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-maquette-ko)"/><text x="163.8" y="731.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,748.0 L50,748.0" stroke="#fab219" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-maquette-amb)"/><text x="60.0" y="752.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M430.92,740.5 h16 l10,10 v5 h-26 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M446.92,740.5 v10 h10" fill="none" stroke="#c3c2b7" stroke-width="1.2"/><text x="466.9" y="752.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M557.6,740.5 L575.6,740.5 L587.6,748.0 L575.6,755.5 L557.6,755.5 Z" fill="#123f77"/><text x="593.6" y="752.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="776.5" font-size="11" fill="#c3c2b7" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>