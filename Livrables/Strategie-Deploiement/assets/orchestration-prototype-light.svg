<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="782" viewBox="0 0 1120 782" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-prototype-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arr-prototype-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#006300"/></marker><marker id="arr-prototype-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b42323"/></marker><marker id="arr-prototype-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a35d00"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="782" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Exemple d'orchestration pour /prototype : du ticket au prototype</text><rect x="613.4" y="20.0" width="72.4" height="20.0" rx="6" fill="#1c5cab"/><text x="649.6" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DESIGNER</text><text x="24.0" y="56.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">Du ticket au prototype validé par les utilisateurs : l'agent génère en composants DSFR, la règle vérifie les composants, un second agent relit, le designer</text><text x="24.0" y="73.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">montre et itère.</text><rect x="24.0" y="133.0" width="92.0" height="146.5" rx="10" fill="#1c5cab"/><text x="70.0" y="204.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="220.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="127.0" width="980.0" height="158.5" rx="8" fill="#f5f5f2"/><rect x="24.0" y="327.5" width="92.0" height="117.0" rx="10" fill="#006300"/><text x="70.0" y="377.0" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="393.0" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><text x="70.0" y="407.0" font-size="10" fill="#fff" font-weight="normal" text-anchor="middle">déterministe</text><rect x="124.0" y="321.5" width="980.0" height="129.0" rx="8" fill="#f5f5f2"/><rect x="24.0" y="492.5" width="92.0" height="105.0" rx="10" fill="#a35d00"/><text x="70.0" y="543.0" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="559.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="486.5" width="980.0" height="117.0" rx="8" fill="#f5f5f2"/><path d="M216.4,520.2 L216.4,246.5" fill="none" stroke="#a35d00" stroke-width="1.6" marker-end="url(#arr-prototype-amb)"/><path d="M298.8,206.2 L330.8,206.2" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr-prototype-n)"/><path d="M399.2,272.0 L399.2,325.5" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arr-prototype-n)"/><path d="M431.2,327.5 L431.2,274.0" fill="none" stroke="#b42323" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-prototype-ko)"/><rect x="438.2" y="290.8" width="56.8" height="17.0" rx="8" fill="#fcfcfb" stroke="#b42323" stroke-width="1"/><text x="466.6" y="303.2" font-size="9.5" fill="#b42323" font-weight="600" text-anchor="middle">3 essais</text><path d="M415.2,444.5 L415.2,498.0" fill="none" stroke="#b42323" stroke-width="1.6" marker-end="url(#arr-prototype-ko)"/><path d="M497.6,386.0 L514.6,386.0 L514.6,206.2 L529.6,206.2" fill="none" stroke="#006300" stroke-width="1.6" marker-end="url(#arr-prototype-ok)"/><rect x="516.6" y="289.6" width="56.7" height="14.5" rx="3" fill="#fcfcfb"/><text x="520.6" y="300.1" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start">conforme</text><path d="M614.0,133.0 L614.0,101.0 L415.2,101.0 L415.2,138.5" fill="none" stroke="#b42323" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-prototype-ko)"/><rect x="334.0" y="85.5" width="361.2" height="14.5" rx="3" fill="#fcfcfb"/><text x="514.6" y="96.0" font-size="10.5" fill="#b42323" font-weight="600" text-anchor="middle">refusé : le motif repart au prototypeur · 3 essais au plus</text><path d="M696.4,206.2 L713.4,206.2 L713.4,545.0 L728.4,545.0" fill="none" stroke="#006300" stroke-width="1.6" marker-end="url(#arr-prototype-ok)"/><rect x="715.4" y="369.1" width="20.2" height="14.5" rx="3" fill="#fcfcfb"/><text x="719.4" y="379.6" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start">OK</text><path d="M812.8,597.5 L812.8,621.5 L315.8,621.5 L315.8,219.2 L330.8,219.2" fill="none" stroke="#a35d00" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-prototype-amb)"/><rect x="298.4" y="606.0" width="531.7" height="14.5" rx="3" fill="#fcfcfb"/><text x="564.3" y="616.5" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle">retours des utilisateurs : l'agent reprend le prototype, autant de fois que nécessaire</text><path d="M895.2,545.0 L912.2,545.0 L912.2,206.2 L927.2,206.2" fill="none" stroke="#a35d00" stroke-width="1.6" marker-end="url(#arr-prototype-amb)"/><rect x="914.2" y="369.1" width="44.5" height="14.5" rx="3" fill="#fcfcfb"/><text x="918.2" y="379.6" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="start">validé</text><path d="M134,168.0 h154.8 l10,10 v66.5 h-164.8 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M288.8,168.0 v10 h10" fill="none" stroke="#52514e" stroke-width="1.2"/><text x="144.0" y="189.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Le ticket</text><text x="144.0" y="206.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">validé par /plan, avec</text><text x="144.0" y="219.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ses critères</text><text x="144.0" y="233.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">d'acceptation</text><rect x="134.0" y="520.2" width="164.8" height="49.5" rx="9" fill="#fbf1e1"/><text x="144.0" y="541.2" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">Lance /prototype</text><text x="144.0" y="558.2" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">sur le ticket</text><circle cx="135.0" cy="521.2" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="135.0" y="525.2" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="332.8" y="140.5" width="164.8" height="131.5" rx="9" fill="#edf2fb"/><rect x="332.8" y="148.5" width="3" height="115.5" rx="1.5" fill="#1c5cab"/><text x="346.8" y="161.5" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Agent prototypeur</text><circle cx="349.8" cy="174.5" r="1.8" fill="#0b0b0b"/><text x="355.8" y="178.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Lit le ticket</text><circle cx="349.8" cy="188.0" r="1.8" fill="#0b0b0b"/><text x="355.8" y="192.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Génère le prototype en</text><text x="355.8" y="205.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">composants DSFR</text><text x="346.8" y="222.5" font-size="10.5" fill="#52514e" font-style="italic" text-anchor="start">contexte : standards UX</text><text x="346.8" y="235.5" font-size="10.5" fill="#52514e" font-style="italic" text-anchor="start">et UI</text><rect x="346.8" y="245.0" width="42.4" height="18.0" rx="9" fill="#fcfcfb" stroke="#1c5cab" stroke-width="1"/><text x="368.0" y="258.0" font-size="10.5" fill="#1c5cab" font-weight="600" text-anchor="middle">DSFR</text><circle cx="333.8" cy="141.5" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="333.8" y="145.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="332.8" y="327.5" width="164.8" height="117.0" rx="9" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="342.8" y="348.5" font-size="12" fill="#006300" font-weight="600" text-anchor="start">Gardes-fous</text><circle cx="345.8" cy="361.5" r="1.8" fill="#0b0b0b"/><text x="351.8" y="365.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Chaque composant existe</text><text x="351.8" y="379.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">dans le DSFR</text><circle cx="345.8" cy="388.5" r="1.8" fill="#0b0b0b"/><text x="351.8" y="392.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Les fichiers annoncés</text><text x="351.8" y="406.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">sont bien produits</text><circle cx="345.8" cy="415.5" r="1.8" fill="#0b0b0b"/><text x="351.8" y="419.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">La page s'affiche sans</text><text x="351.8" y="433.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">erreur</text><circle cx="333.8" cy="328.5" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="333.8" y="332.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="332.8" y="500.0" width="164.8" height="90.0" rx="9" fill="#fcfcfb" stroke="#b42323" stroke-width="1" stroke-dasharray="4 3"/><text x="342.8" y="521.0" font-size="12" fill="#b42323" font-weight="600" text-anchor="start">Reprend la main</text><text x="342.8" y="538.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">3 échecs :</text><text x="342.8" y="551.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'orchestration</text><text x="342.8" y="565.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">s'arrête, le travail en</text><text x="342.8" y="578.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">cours reste</text><rect x="531.6" y="133.0" width="164.8" height="146.5" rx="9" fill="#edf2fb"/><rect x="531.6" y="141.0" width="3" height="130.5" rx="1.5" fill="#1c5cab"/><text x="545.6" y="151.0" font-size="9.5" fill="#1c5cab" font-weight="600" text-anchor="start" letter-spacing="0.06em">BOUCLE IA · CONTEXTE VIERGE</text><text x="545.6" y="167.0" font-size="12" fill="#0b0b0b" font-weight="600" text-anchor="start">Agent vérificateur</text><circle cx="548.6" cy="180.0" r="1.8" fill="#0b0b0b"/><text x="554.6" y="184.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Le prototype</text><text x="554.6" y="197.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">couvre-t-il le</text><text x="554.6" y="211.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">ticket ?</text><circle cx="548.6" cy="220.5" r="1.8" fill="#0b0b0b"/><text x="554.6" y="224.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">Standards UX</text><text x="554.6" y="238.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">respectés ?</text><text x="545.6" y="255.0" font-size="10.5" fill="#52514e" font-style="italic" text-anchor="start">contexte : le ticket et</text><text x="545.6" y="268.0" font-size="10.5" fill="#52514e" font-style="italic" text-anchor="start">le prototype</text><circle cx="532.6" cy="134.0" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="532.6" y="138.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="730.4" y="492.5" width="164.8" height="105.0" rx="14" fill="#fbf1e1" stroke="#a35d00" stroke-width="1"/><text x="740.4" y="513.5" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">Montre le prototype</text><text x="740.4" y="528.5" font-size="12" fill="#a35d00" font-weight="600" text-anchor="start">aux utilisateurs</text><text x="740.4" y="545.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">retours : l'agent</text><text x="740.4" y="559.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">reprend, autant de fois</text><text x="740.4" y="572.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">qu'il faut</text><text x="740.4" y="586.0" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">OK : prototype validé</text><circle cx="731.4" cy="493.5" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="731.4" y="497.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><path d="M929.2,167.2 L1092.0,167.2 L1104.0,206.2 L1092.0,245.2 L929.2,245.2 Z" fill="#0d366b"/><text x="939.2" y="188.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Prototype DSFR</text><text x="939.2" y="203.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">validé</text><text x="939.2" y="220.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">par les utilisateurs,</text><text x="939.2" y="233.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">prêt pour /maquette</text><circle cx="930.2" cy="168.2" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="930.2" y="172.2" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><circle cx="37.0" cy="673.0" r="10" fill="#0d366b" stroke="#fcfcfb" stroke-width="2"/><text x="37.0" y="677.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="60.0" y="677.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">1, 2, 3… l'ordre des étapes quand tout se passe bien</text><rect x="379.4" y="665.5" width="26.0" height="15.0" rx="4" fill="#edf2fb"/><rect x="379.4" y="668.5" width="3" height="9" rx="1.5" fill="#1c5cab"/><text x="415.4" y="677.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne ; un second agent qui relit = boucle IA</text><rect x="24.0" y="686.5" width="26.0" height="15.0" rx="4" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="60.0" y="698.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">la règle prouve = boucle déterministe : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="614.0" y="686.5" width="26.0" height="15.0" rx="7" fill="#fbf1e1" stroke="#a35d00" stroke-width="1"/><text x="650.0" y="698.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M24,715.0 L50,715.0" stroke="#006300" stroke-width="1.6" fill="none" marker-end="url(#arr-prototype-ok)"/><text x="60.0" y="719.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ça passe</text><path d="M127.76,715.0 L153.76,715.0" stroke="#b42323" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-prototype-ko)"/><text x="163.8" y="719.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,736.0 L50,736.0" stroke="#a35d00" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-prototype-amb)"/><text x="60.0" y="740.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M430.92,728.5 h16 l10,10 v5 h-26 z" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M446.92,728.5 v10 h10" fill="none" stroke="#52514e" stroke-width="1.2"/><text x="466.9" y="740.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M557.6,728.5 L575.6,728.5 L587.6,736.0 L575.6,743.5 L557.6,743.5 Z" fill="#0d366b"/><text x="593.6" y="740.5" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="764.5" font-size="11" fill="#52514e" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>
