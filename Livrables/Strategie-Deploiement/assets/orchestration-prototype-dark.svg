<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/></marker><marker id="arr-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="arr-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="718" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#ffffff" font-weight="600" text-anchor="start">Exemple d'orchestration pour /prototype : du ticket au prototype</text><rect x="593.5" y="20.0" width="72.4" height="20.0" rx="6" fill="#2565bd"/><text x="629.7" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DESIGNER</text><text x="24.0" y="56.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">Du ticket au prototype validé par les utilisateurs : l'agent génère en composants DSFR, la règle vérifie les composants, un second agent relit, le designer montre et</text><text x="24.0" y="73.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">itère.</text><rect x="24.0" y="133.0" width="92.0" height="131.5" rx="10" fill="#2565bd"/><text x="70.0" y="196.8" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="212.8" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="127.0" width="980.0" height="143.5" rx="8" fill="#2c2c2a"/><rect x="24.0" y="312.5" width="92.0" height="103.5" rx="10" fill="#006300"/><text x="70.0" y="362.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="378.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><rect x="124.0" y="306.5" width="980.0" height="115.5" rx="8" fill="#2c2c2a"/><rect x="24.0" y="464.0" width="92.0" height="91.5" rx="10" fill="#fab219"/><text x="70.0" y="507.8" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="523.8" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="458.0" width="980.0" height="103.5" rx="8" fill="#2c2c2a"/><path d="M216.4,485.0 L216.4,232.2" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-amb)"/><path d="M298.8,198.8 L330.8,198.8" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M399.2,264.5 L399.2,310.5" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M431.2,312.5 L431.2,266.5" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><rect x="438.2" y="279.5" width="56.8" height="17.0" rx="8" fill="#1a1a19" stroke="#f07070" stroke-width="1"/><text x="466.6" y="292.0" font-size="9.5" fill="#f07070" font-weight="600" text-anchor="middle">3 essais</text><path d="M415.2,416.0 L415.2,469.5" fill="none" stroke="#f07070" stroke-width="1.6" marker-end="url(#arr-ko)"/><path d="M497.6,364.2 L514.6,364.2 L514.6,198.8 L529.6,198.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-ok)"/><text x="520.6" y="285.5" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">conforme</text><path d="M614.0,139.0 L614.0,101.0 L415.2,101.0 L415.2,131.0" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="514.6" y="96.0" font-size="10.5" fill="#f07070" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">refusé : le motif repart au prototypeur · 3 essais au plus</text><path d="M696.4,198.8 L713.4,198.8 L713.4,509.8 L728.4,509.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-ok)"/><text x="719.4" y="358.2" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">OK</text><path d="M812.8,555.5 L812.8,579.5 L315.8,579.5 L315.8,211.8 L330.8,211.8" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="564.3" y="574.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">retours des utilisateurs : l'agent reprend le prototype, autant de fois que nécessaire</text><path d="M895.2,509.8 L912.2,509.8 L912.2,198.8 L927.2,198.8" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-amb)"/><text x="918.2" y="358.2" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">validé</text><path d="M134.0,167.25 h154.8 l10,10 v53.0 h-164.8 z" fill="#1a1a19" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M288.8,167.25 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="144.0" y="188.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Le ticket</text><text x="144.0" y="205.2" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">validé par /plan, avec ses</text><text x="144.0" y="218.8" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">critères d'acceptation</text><rect x="134.0" y="485.0" width="164.8" height="49.5" rx="9" fill="#2a2418"/><text x="144.0" y="506.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Lance /prototype</text><text x="144.0" y="523.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">sur le ticket</text><rect x="332.8" y="133.0" width="164.8" height="131.5" rx="9" fill="#20242c"/><rect x="332.8" y="141.0" width="3" height="115.5" rx="1.5" fill="#2565bd"/><text x="346.8" y="154.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent prototypeur</text><circle cx="349.8" cy="167.0" r="1.8" fill="#ffffff"/><text x="355.8" y="171.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Lit le ticket</text><circle cx="349.8" cy="180.5" r="1.8" fill="#ffffff"/><text x="355.8" y="184.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Génère le prototype HTML</text><text x="355.8" y="198.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">en composants DSFR</text><text x="346.8" y="215.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : standards UX et</text><text x="346.8" y="228.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">UI</text><rect x="346.8" y="237.5" width="42.4" height="18.0" rx="9" fill="#1a1a19" stroke="#3987e5" stroke-width="1"/><text x="368.0" y="250.5" font-size="10.5" fill="#3987e5" font-weight="600" text-anchor="middle">DSFR</text><rect x="332.8" y="312.5" width="164.8" height="103.5" rx="9" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="342.8" y="333.5" font-size="12" fill="#0ca30c" font-weight="600" text-anchor="start">Gardes-fous</text><circle cx="345.8" cy="346.5" r="1.8" fill="#ffffff"/><text x="351.8" y="350.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Chaque composant existe</text><text x="351.8" y="364.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">dans le DSFR</text><circle cx="345.8" cy="373.5" r="1.8" fill="#ffffff"/><text x="351.8" y="377.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Les fichiers annoncés</text><text x="351.8" y="391.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">sont bien produits</text><circle cx="345.8" cy="400.5" r="1.8" fill="#ffffff"/><text x="351.8" y="404.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">HTML valide, sans erreur</text><rect x="332.8" y="471.5" width="164.8" height="76.5" rx="9" fill="#1a1a19" stroke="#f07070" stroke-width="1" stroke-dasharray="4 3"/><text x="342.8" y="492.5" font-size="12" fill="#f07070" font-weight="600" text-anchor="start">Reprend la main</text><text x="342.8" y="509.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">3 échecs : l'orchestration</text><text x="342.8" y="523.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">s'arrête, le travail en</text><text x="342.8" y="536.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">cours reste</text><rect x="531.6" y="139.0" width="164.8" height="119.5" rx="9" fill="#20242c"/><rect x="531.6" y="147.0" width="3" height="103.5" rx="1.5" fill="#2565bd"/><text x="545.6" y="157.0" font-size="9.5" fill="#3987e5" font-weight="600" text-anchor="start" letter-spacing="0.06em">BOUCLE IA · CONTEXTE VIERGE</text><text x="545.6" y="173.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent vérificateur</text><circle cx="548.6" cy="186.0" r="1.8" fill="#ffffff"/><text x="554.6" y="190.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Le prototype couvre-t-il</text><text x="554.6" y="203.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">le ticket ?</text><circle cx="548.6" cy="213.0" r="1.8" fill="#ffffff"/><text x="554.6" y="217.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Standards UX respectés ?</text><text x="545.6" y="234.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : le ticket et le</text><text x="545.6" y="247.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">prototype</text><rect x="730.4" y="464.0" width="164.8" height="91.5" rx="14" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="740.4" y="485.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Montre le prototype</text><text x="740.4" y="500.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">aux utilisateurs</text><text x="740.4" y="517.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">retours : l'agent reprend,</text><text x="740.4" y="530.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">autant de fois qu'il faut</text><text x="740.4" y="544.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">OK : prototype validé</text><path d="M929.2,167.2 L1092.0,167.2 L1104.0,198.8 L1092.0,230.2 L929.2,230.2 Z" fill="#123f77"/><text x="939.2" y="188.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Prototype DSFR validé</text><text x="939.2" y="205.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">par les utilisateurs, prêt</text><text x="939.2" y="218.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">pour /maquette</text><rect x="24.0" y="623.5" width="26.0" height="15.0" rx="4" fill="#20242c"/><rect x="24.0" y="626.5" width="3" height="9" rx="1.5" fill="#2565bd"/><text x="60.0" y="635.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne</text><rect x="467.0" y="623.5" width="26.0" height="15.0" rx="4" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="503.0" y="635.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">la règle prouve : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="24.0" y="644.5" width="26.0" height="15.0" rx="7" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="60.0" y="656.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M439.5,652.0 L465.5,652.0" stroke="#0ca30c" stroke-width="1.6" fill="none" marker-end="url(#arr-ok)"/><text x="475.5" y="656.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ça passe</text><path d="M541.5,652.0 L567.5,652.0" stroke="#f07070" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="577.5" y="656.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,673.0 L50,673.0" stroke="#fab219" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="60.0" y="677.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M417.5,665.5 h16 l10,10 v5 h-26 z" fill="#1a1a19" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M433.5,665.5 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="453.5" y="677.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M541.5,665.5 L559.5,665.5 L571.5,673.0 L559.5,680.5 L541.5,680.5 Z" fill="#123f77"/><text x="577.5" y="677.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="701.5" font-size="11" fill="#898781" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>