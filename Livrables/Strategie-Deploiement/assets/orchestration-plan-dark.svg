<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/></marker><marker id="arr-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="arr-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="798" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#ffffff" font-weight="600" text-anchor="start">Exemple d'orchestration pour /plan : refinement du ticket</text><rect x="532.8" y="20.0" width="147.2" height="20.0" rx="6" fill="#2565bd"/><text x="606.4" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">RESPONSABLE PRODUIT</text><text x="24.0" y="56.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">Du besoin brut au ticket publié : un agent questionne, un autre rédige, la règle contrôle la forme, un troisième relit à froid, le responsable produit valide.</text><rect x="24.0" y="116.0" width="92.0" height="186.5" rx="10" fill="#2565bd"/><text x="70.0" y="207.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="223.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="110.0" width="980.0" height="198.5" rx="8" fill="#2c2c2a"/><rect x="24.0" y="350.5" width="92.0" height="145.5" rx="10" fill="#006300"/><text x="70.0" y="421.2" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="437.2" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><rect x="124.0" y="344.5" width="980.0" height="157.5" rx="8" fill="#2c2c2a"/><rect x="24.0" y="544.0" width="92.0" height="91.5" rx="10" fill="#fab219"/><text x="70.0" y="587.8" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="603.8" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="538.0" width="980.0" height="103.5" rx="8" fill="#2c2c2a"/><path d="M199.8,557.5 L199.8,256.2" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-amb)"/><path d="M265.7,209.2 L297.7,209.2" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M349.5,301.8 L349.5,542.0" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-n)"/><text x="342.5" y="425.9" font-size="10.5" fill="#c3c2b7" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">questions</text><path d="M381.5,544.0 L381.5,303.8" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-amb)"/><text x="388.5" y="427.9" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">réponses</text><path d="M431.3,209.2 L463.3,209.2" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-ok)"/><path d="M515.2,302.5 L515.2,348.5" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-n)"/><path d="M547.2,350.5 L547.2,304.5" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><rect x="554.2" y="317.5" width="56.8" height="17.0" rx="8" fill="#1a1a19" stroke="#f07070" stroke-width="1"/><text x="582.6" y="330.0" font-size="9.5" fill="#f07070" font-weight="600" text-anchor="middle">3 essais</text><path d="M531.2,496.0 L531.2,542.8" fill="none" stroke="#f07070" stroke-width="1.6" marker-end="url(#arr-ko)"/><path d="M597.0,423.2 L614.0,423.2 L614.0,209.2 L629.0,209.2" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-ok)"/><text x="620.0" y="320.2" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">conforme</text><path d="M696.8,142.8 L696.8,84.0 L531.2,84.0 L531.2,114.0" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="614.0" y="79.0" font-size="10.5" fill="#f07070" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">refusé : le motif repart au rédacteur · 3 essais au plus</text><path d="M762.7,209.2 L779.7,209.2 L779.7,589.8 L794.7,589.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-ok)"/><text x="785.7" y="403.5" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">OK</text><path d="M862.5,635.5 L862.5,659.5 L448.3,659.5 L448.3,222.2 L463.3,222.2" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="655.4" y="654.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">non : sa remarque repart à l'agent rédacteur, le brouillon reste</text><path d="M928.3,589.8 L945.3,589.8 L945.3,209.2 L960.3,209.2" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-amb)"/><text x="951.3" y="403.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#1a1a19" stroke-width="3.5" stroke-linejoin="round">oui</text><path d="M134.0,164.25 h121.66666666666666 l10,10 v80.0 h-131.66666666666666 z" fill="#1a1a19" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M255.66666666666663,164.25 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="144.0" y="185.2" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Le besoin</text><text x="144.0" y="202.2" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">tel qu'il arrive :</text><text x="144.0" y="215.8" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">quelques lignes, un</text><text x="144.0" y="229.2" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">mail, un compte</text><text x="144.0" y="242.8" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">rendu</text><rect x="134.0" y="557.5" width="131.7" height="64.5" rx="9" fill="#2a2418"/><text x="144.0" y="578.5" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Apporte le</text><text x="144.0" y="593.5" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">besoin</text><text x="144.0" y="610.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">et lance /plan</text><rect x="299.7" y="116.8" width="131.7" height="185.0" rx="9" fill="#20242c"/><rect x="299.7" y="124.8" width="3" height="169.0" rx="1.5" fill="#2565bd"/><text x="313.7" y="137.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent challenge</text><circle cx="316.7" cy="150.8" r="1.8" fill="#ffffff"/><text x="322.7" y="154.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Relève les</text><text x="322.7" y="168.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">imprécisions et</text><text x="322.7" y="181.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">les contradictions</text><circle cx="316.7" cy="191.2" r="1.8" fill="#ffffff"/><text x="322.7" y="195.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Pose ses</text><text x="322.7" y="208.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">questions, une à</text><text x="322.7" y="222.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">la fois</text><text x="313.7" y="239.2" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : skill de</text><text x="313.7" y="252.2" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">challenge · standard</text><text x="313.7" y="265.2" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">de ticket</text><rect x="313.7" y="274.8" width="42.4" height="18.0" rx="9" fill="#1a1a19" stroke="#3987e5" stroke-width="1"/><text x="334.9" y="287.8" font-size="10.5" fill="#3987e5" font-weight="600" text-anchor="middle">Jira</text><rect x="299.7" y="544.0" width="131.7" height="91.5" rx="9" fill="#2a2418"/><text x="309.7" y="565.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Répond aux</text><text x="309.7" y="580.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">questions</text><text x="309.7" y="597.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">jusqu'à ce qu'il</text><text x="309.7" y="610.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">n'en reste aucune de</text><text x="309.7" y="624.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">bloquante</text><rect x="465.3" y="116.0" width="131.7" height="186.5" rx="9" fill="#20242c"/><rect x="465.3" y="124.0" width="3" height="170.5" rx="1.5" fill="#2565bd"/><text x="479.3" y="137.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent rédacteur</text><circle cx="482.3" cy="150.0" r="1.8" fill="#ffffff"/><text x="488.3" y="154.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Rédige le ticket</text><text x="488.3" y="167.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">au standard de</text><text x="488.3" y="181.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">l'équipe</text><circle cx="482.3" cy="190.5" r="1.8" fill="#ffffff"/><text x="488.3" y="194.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Propose et</text><text x="488.3" y="208.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">complète les</text><text x="488.3" y="221.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">critères</text><text x="488.3" y="235.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">d'acceptation</text><text x="479.3" y="252.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : standard</text><text x="479.3" y="265.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">de ticket · règles de</text><text x="479.3" y="278.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">rédaction des</text><text x="479.3" y="291.0" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">critères</text><rect x="465.3" y="350.5" width="131.7" height="145.5" rx="9" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="475.3" y="371.5" font-size="12" fill="#0ca30c" font-weight="600" text-anchor="start">Contrôle de</text><text x="475.3" y="386.5" font-size="12" fill="#0ca30c" font-weight="600" text-anchor="start">forme</text><circle cx="478.3" cy="399.5" r="1.8" fill="#ffffff"/><text x="484.3" y="403.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Sections</text><text x="484.3" y="417.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">obligatoires</text><text x="484.3" y="430.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">présentes</text><circle cx="478.3" cy="440.0" r="1.8" fill="#ffffff"/><text x="484.3" y="444.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Critères au format</text><text x="484.3" y="457.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Étant donné /</text><text x="484.3" y="471.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Quand / Alors</text><circle cx="478.3" cy="480.5" r="1.8" fill="#ffffff"/><text x="484.3" y="484.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Aucun champ vide</text><rect x="465.3" y="544.8" width="131.7" height="90.0" rx="9" fill="#1a1a19" stroke="#f07070" stroke-width="1" stroke-dasharray="4 3"/><text x="475.3" y="565.8" font-size="12" fill="#f07070" font-weight="600" text-anchor="start">Reprend la main</text><text x="475.3" y="582.8" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">3 échecs :</text><text x="475.3" y="596.2" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'orchestration</text><text x="475.3" y="609.8" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">s'arrête, le travail</text><text x="475.3" y="623.2" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">en cours reste</text><rect x="631.0" y="142.8" width="131.7" height="133.0" rx="9" fill="#20242c"/><rect x="631.0" y="150.8" width="3" height="117.0" rx="1.5" fill="#2565bd"/><text x="645.0" y="160.8" font-size="9.5" fill="#3987e5" font-weight="600" text-anchor="start" letter-spacing="0.06em">BOUCLE IA · CONTEXTE VIERGE</text><text x="645.0" y="176.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent relecteur</text><text x="645.0" y="193.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Relit le ticket</text><text x="645.0" y="207.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">seul : testable ?</text><text x="645.0" y="220.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">complet ? sans</text><text x="645.0" y="234.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">ambiguïté ?</text><text x="645.0" y="251.2" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">contexte : le ticket,</text><text x="645.0" y="264.2" font-size="10.5" fill="#898781" font-style="italic" text-anchor="start">pas la conversation</text><rect x="796.7" y="544.0" width="131.7" height="91.5" rx="14" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="806.7" y="565.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Valide le</text><text x="806.7" y="580.0" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">ticket ?</text><text x="806.7" y="597.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">oui : il est publié</text><text x="806.7" y="610.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">non : sa remarque</text><text x="806.7" y="624.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">repart à l'agent</text><path d="M962.3,151.0 L1092.0,151.0 L1104.0,209.2 L1092.0,267.5 L962.3,267.5 Z" fill="#123f77"/><text x="972.3" y="172.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Ticket Jira</text><text x="972.3" y="187.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">publié</text><text x="972.3" y="204.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">au standard, avec</text><text x="972.3" y="217.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">ses critères</text><text x="972.3" y="231.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">d'acceptation</text><rect x="972.3" y="240.5" width="42.4" height="18.0" rx="9" fill="none" stroke="#ffffff" stroke-width="1"/><text x="993.5" y="253.5" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">Jira</text><rect x="24.0" y="703.5" width="26.0" height="15.0" rx="4" fill="#20242c"/><rect x="24.0" y="706.5" width="3" height="9" rx="1.5" fill="#2565bd"/><text x="60.0" y="715.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne</text><rect x="467.0" y="703.5" width="26.0" height="15.0" rx="4" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="503.0" y="715.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">la règle prouve : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="24.0" y="724.5" width="26.0" height="15.0" rx="7" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="60.0" y="736.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M439.5,732.0 L465.5,732.0" stroke="#0ca30c" stroke-width="1.6" fill="none" marker-end="url(#arr-ok)"/><text x="475.5" y="736.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ça passe</text><path d="M541.5,732.0 L567.5,732.0" stroke="#f07070" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-ko)"/><text x="577.5" y="736.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,753.0 L50,753.0" stroke="#fab219" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-amb)"/><text x="60.0" y="757.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M417.5,745.5 h16 l10,10 v5 h-26 z" fill="#1a1a19" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M433.5,745.5 v10 h10" fill="none" stroke="#898781" stroke-width="1.2"/><text x="453.5" y="757.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M541.5,745.5 L559.5,745.5 L571.5,753.0 L559.5,760.5 L541.5,760.5 Z" fill="#123f77"/><text x="577.5" y="757.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="781.5" font-size="11" fill="#898781" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>