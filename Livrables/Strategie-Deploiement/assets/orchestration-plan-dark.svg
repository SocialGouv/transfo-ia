<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="776" viewBox="0 0 1120 776" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="arr-plan-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker><marker id="arr-plan-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ca30c"/></marker><marker id="arr-plan-ko" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f07070"/></marker><marker id="arr-plan-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fab219"/></marker></defs><rect x="0.5" y="0.5" width="1119" height="774" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="24.0" y="34.0" font-size="15.5" fill="#ffffff" font-weight="600" text-anchor="start">Exemple d'orchestration pour /plan : refinement du ticket</text><rect x="550.4" y="20.0" width="147.2" height="20.0" rx="6" fill="#2565bd"/><text x="624.0" y="34.0" font-size="10.5" fill="#fff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">RESPONSABLE PRODUIT</text><text x="24.0" y="56.0" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">Du besoin brut au ticket publié : un agent questionne, un autre rédige, la règle contrôle la forme, un troisième relit à froid, le responsable produit valide.</text><rect x="24.0" y="116.0" width="92.0" height="171.5" rx="10" fill="#2565bd"/><text x="70.0" y="199.8" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">L'agent</text><text x="70.0" y="215.8" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">propose</text><rect x="124.0" y="110.0" width="980.0" height="183.5" rx="8" fill="#232322"/><rect x="24.0" y="335.5" width="92.0" height="117.0" rx="10" fill="#006300"/><text x="70.0" y="385.0" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle">La règle</text><text x="70.0" y="401.0" font-size="11" fill="#fff" font-weight="normal" text-anchor="middle">prouve</text><text x="70.0" y="415.0" font-size="10" fill="#fff" font-weight="normal" text-anchor="middle">déterministe</text><rect x="124.0" y="329.5" width="980.0" height="129.0" rx="8" fill="#232322"/><rect x="24.0" y="500.5" width="92.0" height="90.0" rx="10" fill="#fab219"/><text x="70.0" y="543.5" font-size="12.5" fill="#0b0b0b" font-weight="600" text-anchor="middle">L'humain</text><text x="70.0" y="559.5" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="middle">décide</text><rect x="124.0" y="494.5" width="980.0" height="102.0" rx="8" fill="#232322"/><path d="M216.4,520.8 L216.4,242.0" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-amb)"/><path d="M298.8,201.8 L330.8,201.8" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-n)"/><path d="M399.2,287.5 L399.2,505.2" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-n)"/><rect x="333.4" y="389.9" width="62.8" height="14.5" rx="3" fill="#1a1a19"/><text x="392.2" y="400.4" font-size="10.5" fill="#c3c2b7" font-weight="600" text-anchor="end">questions</text><path d="M431.2,507.2 L431.2,289.5" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-amb)"/><rect x="434.2" y="391.9" width="56.7" height="14.5" rx="3" fill="#1a1a19"/><text x="438.2" y="402.4" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start">réponses</text><path d="M497.6,201.8 L529.6,201.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-plan-ok)"/><path d="M598.0,275.0 L598.0,333.5" fill="none" stroke="#c3c2b7" stroke-width="1.6" marker-end="url(#arr-plan-n)"/><path d="M630.0,335.5 L630.0,277.0" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-plan-ko)"/><rect x="637.0" y="296.2" width="56.8" height="17.0" rx="8" fill="#1a1a19" stroke="#f07070" stroke-width="1"/><text x="665.4" y="308.8" font-size="9.5" fill="#f07070" font-weight="600" text-anchor="middle">3 essais</text><path d="M614.0,452.5 L614.0,498.5" fill="none" stroke="#f07070" stroke-width="1.6" marker-end="url(#arr-plan-ko)"/><path d="M696.4,394.0 L713.4,394.0 L713.4,201.8 L728.4,201.8" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-plan-ok)"/><rect x="715.4" y="291.4" width="56.7" height="14.5" rx="3" fill="#1a1a19"/><text x="719.4" y="301.9" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start">conforme</text><path d="M812.8,142.0 L812.8,84.0 L614.0,84.0 L614.0,126.5" fill="none" stroke="#f07070" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-plan-ko)"/><rect x="538.9" y="68.5" width="349.0" height="14.5" rx="3" fill="#1a1a19"/><text x="713.4" y="79.0" font-size="10.5" fill="#f07070" font-weight="600" text-anchor="middle">refusé : le motif repart au rédacteur · 3 essais au plus</text><path d="M895.2,201.8 L912.2,201.8 L912.2,545.5 L927.2,545.5" fill="none" stroke="#0ca30c" stroke-width="1.6" marker-end="url(#arr-plan-ok)"/><rect x="914.2" y="367.1" width="20.2" height="14.5" rx="3" fill="#1a1a19"/><text x="918.2" y="377.6" font-size="10.5" fill="#0ca30c" font-weight="600" text-anchor="start">OK</text><path d="M1011.6,583.8 L1011.6,614.5 L514.6,614.5 L514.6,214.8 L529.6,214.8" fill="none" stroke="#fab219" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-plan-amb)"/><rect x="564.2" y="599.0" width="397.8" height="14.5" rx="3" fill="#1a1a19"/><text x="763.1" y="609.5" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="middle">non : sa remarque repart à l'agent rédacteur, le brouillon reste</text><path d="M1094.0,545.5 L1011.6,545.5 L1011.6,201.8 L927.2,201.8" fill="none" stroke="#fab219" stroke-width="1.6" marker-end="url(#arr-plan-amb)"/><rect x="1013.6" y="367.1" width="26.3" height="14.5" rx="3" fill="#1a1a19"/><text x="1017.6" y="377.6" font-size="10.5" fill="#fab219" font-weight="600" text-anchor="start">oui</text><path d="M134,163.5 h154.8 l10,10 v66.5 h-164.8 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M288.8,163.5 v10 h10" fill="none" stroke="#c3c2b7" stroke-width="1.2"/><text x="144.0" y="184.5" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Le besoin</text><text x="144.0" y="201.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">tel qu'il arrive :</text><text x="144.0" y="215.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">quelques lignes, un</text><text x="144.0" y="228.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">mail, un compte rendu</text><rect x="134.0" y="520.8" width="164.8" height="49.5" rx="9" fill="#2a2418"/><text x="144.0" y="541.8" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Apporte le besoin</text><text x="144.0" y="558.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">et lance /plan</text><circle cx="135.0" cy="521.8" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="135.0" y="525.8" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="332.8" y="116.0" width="164.8" height="171.5" rx="9" fill="#20242c"/><rect x="332.8" y="124.0" width="3" height="155.5" rx="1.5" fill="#2565bd"/><text x="346.8" y="137.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent challenge</text><circle cx="349.8" cy="150.0" r="1.8" fill="#ffffff"/><text x="355.8" y="154.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Relève les</text><text x="355.8" y="167.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">imprécisions et les</text><text x="355.8" y="181.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">contradictions</text><circle cx="349.8" cy="190.5" r="1.8" fill="#ffffff"/><text x="355.8" y="194.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Pose ses questions,</text><text x="355.8" y="208.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">une à la fois</text><text x="346.8" y="225.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">contexte : skill de</text><text x="346.8" y="238.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">challenge · standard de</text><text x="346.8" y="251.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">ticket</text><rect x="346.8" y="260.5" width="42.4" height="18.0" rx="9" fill="#1a1a19" stroke="#3987e5" stroke-width="1"/><text x="368.0" y="273.5" font-size="10.5" fill="#3987e5" font-weight="600" text-anchor="middle">Jira</text><circle cx="333.8" cy="117.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="333.8" y="121.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="332.8" y="507.2" width="164.8" height="76.5" rx="9" fill="#2a2418"/><text x="342.8" y="528.2" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Répond aux questions</text><text x="342.8" y="545.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">jusqu'à ce qu'il n'en</text><text x="342.8" y="558.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">reste aucune de</text><text x="342.8" y="572.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">bloquante</text><circle cx="333.8" cy="508.2" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="333.8" y="512.2" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="531.6" y="128.5" width="164.8" height="146.5" rx="9" fill="#20242c"/><rect x="531.6" y="136.5" width="3" height="130.5" rx="1.5" fill="#2565bd"/><text x="545.6" y="149.5" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent rédacteur</text><circle cx="548.6" cy="162.5" r="1.8" fill="#ffffff"/><text x="554.6" y="166.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Rédige le ticket au</text><text x="554.6" y="180.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">standard de l'équipe</text><circle cx="548.6" cy="189.5" r="1.8" fill="#ffffff"/><text x="554.6" y="193.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Propose et complète</text><text x="554.6" y="207.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">les critères</text><text x="554.6" y="220.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">d'acceptation</text><text x="545.6" y="237.5" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">contexte : standard de</text><text x="545.6" y="250.5" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">ticket · règles de</text><text x="545.6" y="263.5" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">rédaction des critères</text><circle cx="532.6" cy="129.5" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="532.6" y="133.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><rect x="531.6" y="335.5" width="164.8" height="117.0" rx="9" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="541.6" y="356.5" font-size="12" fill="#0ca30c" font-weight="600" text-anchor="start">Contrôle de forme</text><circle cx="544.6" cy="369.5" r="1.8" fill="#ffffff"/><text x="550.6" y="373.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Sections obligatoires</text><text x="550.6" y="387.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">présentes</text><circle cx="544.6" cy="396.5" r="1.8" fill="#ffffff"/><text x="550.6" y="400.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Chaque critère</text><text x="550.6" y="414.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">d'acceptation suit le</text><text x="550.6" y="427.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">gabarit de l'équipe</text><circle cx="544.6" cy="437.0" r="1.8" fill="#ffffff"/><text x="550.6" y="441.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Aucun champ vide</text><circle cx="532.6" cy="336.5" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="532.6" y="340.5" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><rect x="531.6" y="500.5" width="164.8" height="90.0" rx="9" fill="#1a1a19" stroke="#f07070" stroke-width="1" stroke-dasharray="4 3"/><text x="541.6" y="521.5" font-size="12" fill="#f07070" font-weight="600" text-anchor="start">Reprend la main</text><text x="541.6" y="538.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">3 échecs :</text><text x="541.6" y="552.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'orchestration</text><text x="541.6" y="565.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">s'arrête, le travail en</text><text x="541.6" y="579.0" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">cours reste</text><rect x="730.4" y="142.0" width="164.8" height="119.5" rx="9" fill="#20242c"/><rect x="730.4" y="150.0" width="3" height="103.5" rx="1.5" fill="#2565bd"/><text x="744.4" y="160.0" font-size="9.5" fill="#3987e5" font-weight="600" text-anchor="start" letter-spacing="0.06em">BOUCLE IA · CONTEXTE VIERGE</text><text x="744.4" y="176.0" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Agent relecteur</text><text x="744.4" y="193.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">Relit le ticket seul :</text><text x="744.4" y="206.5" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">testable ? complet ?</text><text x="744.4" y="220.0" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">sans ambiguïté ?</text><text x="744.4" y="237.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">contexte : le ticket, pas</text><text x="744.4" y="250.0" font-size="10.5" fill="#c3c2b7" font-style="italic" text-anchor="start">la conversation</text><circle cx="731.4" cy="143.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="731.4" y="147.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><rect x="929.2" y="507.2" width="164.8" height="76.5" rx="14" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="939.2" y="528.2" font-size="12" fill="#fab219" font-weight="600" text-anchor="start">Valide le ticket ?</text><text x="939.2" y="545.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">oui : il est publié</text><text x="939.2" y="558.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">non : sa remarque repart</text><text x="939.2" y="572.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">à l'agent</text><circle cx="930.2" cy="508.2" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="930.2" y="512.2" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><path d="M929.2,157.8 L1092.0,157.8 L1104.0,201.8 L1092.0,245.8 L929.2,245.8 Z" fill="#123f77"/><text x="939.2" y="178.8" font-size="12" fill="#ffffff" font-weight="600" text-anchor="start">Ticket Jira publié</text><text x="939.2" y="195.8" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">au standard, avec ses</text><text x="939.2" y="209.2" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="start">critères d'acceptation</text><rect x="939.2" y="218.8" width="42.4" height="18.0" rx="9" fill="none" stroke="#ffffff" stroke-width="1"/><text x="960.4" y="231.8" font-size="10.5" fill="#ffffff" font-weight="600" text-anchor="middle">Jira</text><circle cx="930.2" cy="158.8" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="930.2" y="162.8" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">8</text><circle cx="37.0" cy="666.0" r="10" fill="#123f77" stroke="#1a1a19" stroke-width="2"/><text x="37.0" y="670.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="60.0" y="670.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">1, 2, 3… l'ordre des étapes quand tout se passe bien</text><rect x="379.4" y="658.5" width="26.0" height="15.0" rx="4" fill="#20242c"/><rect x="379.4" y="661.5" width="3" height="9" rx="1.5" fill="#2565bd"/><text x="415.4" y="670.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'agent propose : contexte vierge, il ne reçoit que ce qui le concerne ; un second agent qui relit = boucle IA</text><rect x="24.0" y="679.5" width="26.0" height="15.0" rx="4" fill="#1f271f" stroke="#0ca30c" stroke-width="1"/><text x="60.0" y="691.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">la règle prouve = boucle déterministe : test, lint, contrôle ; vert ou rouge, sans discussion</text><rect x="614.0" y="679.5" width="26.0" height="15.0" rx="7" fill="#2a2418" stroke="#fab219" stroke-width="1"/><text x="650.0" y="691.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">l'humain décide : lance, répond, tranche, valide, reprend la main</text><path d="M24,708.0 L50,708.0" stroke="#0ca30c" stroke-width="1.6" fill="none" marker-end="url(#arr-plan-ok)"/><text x="60.0" y="712.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ça passe</text><path d="M127.76,708.0 L153.76,708.0" stroke="#f07070" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-plan-ko)"/><text x="163.8" y="712.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">pas conforme : le motif repart à l'agent, 3 essais au plus, puis l'humain reprend la main</text><path d="M24,729.0 L50,729.0" stroke="#fab219" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-plan-amb)"/><text x="60.0" y="733.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">un « non » ou des retours : l'agent reprend, rien n'est perdu</text><path d="M430.92,721.5 h16 l10,10 v5 h-26 z" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M446.92,721.5 v10 h10" fill="none" stroke="#c3c2b7" stroke-width="1.2"/><text x="466.9" y="733.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui entre</text><path d="M557.6,721.5 L575.6,721.5 L587.6,729.0 L575.6,736.5 L557.6,736.5 Z" fill="#123f77"/><text x="593.6" y="733.5" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">ce qui sort</text><text x="24.0" y="757.5" font-size="11" fill="#c3c2b7" font-style="italic" text-anchor="start">Un exemple, pas un standard : un déroulé possible parmi d'autres. Chaque équipe compose le sien, avec ses standards, ses outils et ses gardes-fous.</text></svg>