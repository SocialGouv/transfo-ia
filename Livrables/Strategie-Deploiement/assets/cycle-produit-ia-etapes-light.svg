<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900.5" viewBox="0 0 1300 900.5" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0.5" y="0.5" width="1299" height="899.5" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/><text x="32.0" y="40.0" font-size="15.5" fill="#0b0b0b" font-weight="600" text-anchor="start">Le cycle produit augmenté par l'IA : cinq skills, du besoin au code livré</text><text x="32.0" y="61.0" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">L'agent propose, la règle prouve, l'humain valide · chaque skill part des standards de l'équipe, parle aux outils par MCP et produit l'artefact qui alimente le skill suivant</text><rect x="57.0" y="84.0" width="186.0" height="22.0" rx="6" fill="#1c5cab"/><text x="150.0" y="99.5" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">RESPONSABLE PRODUIT</text><rect x="307.0" y="84.0" width="436.0" height="22.0" rx="6" fill="#1c5cab"/><text x="525.0" y="99.5" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DESIGNER</text><rect x="807.0" y="84.0" width="436.0" height="22.0" rx="6" fill="#1c5cab"/><text x="1025.0" y="99.5" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle" letter-spacing="0.08em">DÉVELOPPEUR</text><line x1="150" y1="172" x2="1150" y2="172" stroke="#1c5cab" stroke-width="3"/><path d="M383,172 l-11,-6 v12 z" fill="#1c5cab"/><circle cx="202" cy="172" r="8" fill="#a35d00" stroke="#fcfcfb" stroke-width="2"/><text x="202.0" y="197.0" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle">répond, valide le ticket</text><rect x="255.7" y="146.0" width="88.6" height="20.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><text x="300.0" y="160.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">ticket Jira</text><path d="M633,172 l-11,-6 v12 z" fill="#1c5cab"/><circle cx="452" cy="172" r="8" fill="#a35d00" stroke="#fcfcfb" stroke-width="2"/><text x="452.0" y="197.0" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle">le montre aux utilisateurs</text><rect x="489.2" y="146.0" width="121.6" height="20.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><text x="550.0" y="160.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">prototype validé</text><path d="M883,172 l-11,-6 v12 z" fill="#1c5cab"/><circle cx="702" cy="172" r="8" fill="#a35d00" stroke="#fcfcfb" stroke-width="2"/><text x="702.0" y="197.0" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle">valide les maquettes</text><rect x="742.5" y="146.0" width="115.0" height="20.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><text x="800.0" y="160.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">maquettes Figma</text><path d="M1133,172 l-11,-6 v12 z" fill="#1c5cab"/><circle cx="952" cy="172" r="8" fill="#a35d00" stroke="#fcfcfb" stroke-width="2"/><text x="952.0" y="197.0" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="middle">tranche, valide le plan</text><rect x="979.3" y="146.0" width="141.4" height="20.0" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/><text x="1050.0" y="160.0" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="middle">plan + impact prévu</text><circle cx="150" cy="172" r="15" fill="#1c5cab" stroke="#fcfcfb" stroke-width="3"/><text x="150.0" y="176.5" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">1</text><rect x="57.0" y="216.0" width="186.0" height="198.5" rx="10" fill="#edf2fb"/><text x="69.0" y="240.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">/plan</text><text x="69.0" y="255.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">refinement du ticket</text><text x="69.0" y="276.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Challenge le besoin,</text><text x="69.0" y="290.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">rédige le ticket au</text><text x="69.0" y="305.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">standard de l'équipe,</text><text x="69.0" y="319.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">propose les critères</text><text x="69.0" y="334.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">d'acceptation</text><rect x="69.0" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="92.4" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Jira</text><circle cx="400" cy="172" r="15" fill="#1c5cab" stroke="#fcfcfb" stroke-width="3"/><text x="400.0" y="176.5" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">2</text><rect x="307.0" y="216.0" width="186.0" height="198.5" rx="10" fill="#edf2fb"/><text x="319.0" y="240.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">/prototype</text><text x="319.0" y="255.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">du ticket au prototype</text><text x="319.0" y="276.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Génère un prototype selon</text><text x="319.0" y="290.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">les standards UX et UI, en</text><text x="319.0" y="305.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">composants DSFR</text><rect x="319.0" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="342.4" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">DSFR</text><circle cx="650" cy="172" r="15" fill="#1c5cab" stroke="#fcfcfb" stroke-width="3"/><text x="650.0" y="176.5" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">3</text><rect x="557.0" y="216.0" width="186.0" height="198.5" rx="10" fill="#edf2fb"/><text x="569.0" y="240.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">/maquette</text><text x="569.0" y="255.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">du prototype validé à Figma</text><text x="569.0" y="276.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Pousse le prototype dans</text><text x="569.0" y="290.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Figma, génère les</text><text x="569.0" y="305.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">maquettes en composants</text><text x="569.0" y="319.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">DSFR officiels</text><rect x="569.0" y="356.5" width="54.0" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="596.0" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Figma</text><circle cx="900" cy="172" r="15" fill="#1c5cab" stroke="#fcfcfb" stroke-width="3"/><text x="900.0" y="176.5" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">4</text><rect x="807.0" y="216.0" width="186.0" height="198.5" rx="10" fill="#edf2fb"/><text x="819.0" y="240.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">/plan-tech</text><text x="819.0" y="255.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">plan et revue d'impact</text><text x="819.0" y="276.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Lit le ticket et le code,</text><text x="819.0" y="290.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">écrit le plan</text><text x="819.0" y="305.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">d'implémentation, évalue</text><text x="819.0" y="319.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">l'impact prévu sur le code</text><rect x="819.0" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="842.4" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Jira</text><rect x="871.8" y="356.5" width="54.0" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="898.8" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Figma</text><rect x="931.8" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="955.2" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">DSFR</text><circle cx="1150" cy="172" r="15" fill="#1c5cab" stroke="#fcfcfb" stroke-width="3"/><text x="1150.0" y="176.5" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">5</text><rect x="1057.0" y="216.0" width="186.0" height="198.5" rx="10" fill="#edf2fb"/><text x="1069.0" y="240.0" font-size="15" fill="#0b0b0b" font-weight="600" text-anchor="start">/implementation</text><text x="1069.0" y="255.0" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">code et tests</text><text x="1069.0" y="276.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Phase par phase, codeur et</text><text x="1069.0" y="290.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">testeur séparés, code et</text><text x="1069.0" y="305.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">tests ; stop si un test</text><text x="1069.0" y="319.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">casse sans l'avoir prévu</text><rect x="1069.0" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="1092.4" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Jira</text><rect x="1121.8" y="356.5" width="54.0" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="1148.8" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Figma</text><rect x="1181.8" y="356.5" width="46.8" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="1205.2" y="370.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">DSFR</text><rect x="1069.0" y="382.5" width="90.0" height="20.0" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="1114.0" y="396.5" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">Playwright</text><line x1="1150" y1="414.5" x2="1150" y2="438.5" stroke="#006300" stroke-width="2"/><text x="1160.0" y="430.5" font-size="11" fill="#0b0b0b" font-weight="600" text-anchor="start">code + tests</text><rect x="1057.0" y="438.5" width="186.0" height="108.5" rx="8" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="1069.0" y="458.5" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start" letter-spacing="0.06em">PENDANT /IMPLEMENTATION</text><text x="1069.0" y="476.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">IDE : ESLint</text><text x="1069.0" y="491.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Quality gate avant</text><text x="1069.0" y="505.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">commit : RGAA, standards</text><text x="1069.0" y="520.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">de qualité, build sans</text><text x="1069.0" y="534.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">erreur</text><line x1="1150" y1="547.0" x2="1150" y2="591.0" stroke="#006300" stroke-width="2"/><path d="M1150,593.0 l-6,-10 h12 z" fill="#006300"/><circle cx="1150" cy="567.0" r="8" fill="#a35d00" stroke="#fcfcfb" stroke-width="2"/><text x="1164.0" y="571.0" font-size="10.5" fill="#a35d00" font-weight="600" text-anchor="start">commite et pousse</text><rect x="1057.0" y="593.0" width="186.0" height="123.0" rx="8" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="1069.0" y="613.0" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start" letter-spacing="0.06em">À CHAQUE PUSH, EN BOUCLE</text><text x="1069.0" y="631.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">CI/CD : revue de code par</text><text x="1069.0" y="645.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">un bot IA, puis Sonar</text><text x="1069.0" y="660.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Rejet du bot ou issue</text><text x="1069.0" y="674.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Sonar : la correction</text><text x="1069.0" y="689.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">repart dans</text><text x="1069.0" y="703.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">/implementation</text><line x1="1150" y1="716.0" x2="1150" y2="760.0" stroke="#006300" stroke-width="2"/><path d="M1150,762.0 l-6,-10 h12 z" fill="#006300"/><text x="1164.0" y="740.0" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start">chaque nuit</text><rect x="1057.0" y="762.0" width="186.0" height="108.5" rx="8" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="1069.0" y="782.0" font-size="10.5" fill="#006300" font-weight="600" text-anchor="start" letter-spacing="0.06em">CHAQUE NUIT, HORS BOUCLE</text><text x="1069.0" y="800.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Pré-audit RGAA poussé,</text><text x="1069.0" y="814.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">analyse de sécurité</text><text x="1069.0" y="829.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Chaque écart ouvre un</text><text x="1069.0" y="843.5" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">ticket, corrigé dans un</text><text x="1069.0" y="858.0" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">prochain /plan</text><line x1="57.0" y1="458.5" x2="85.0" y2="458.5" stroke="#1c5cab" stroke-width="3"/><circle cx="71.0" cy="458.5" r="6" fill="#1c5cab"/><text x="95.0" y="462.5" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">le cycle : chaque station produit l'artefact que la suivante consomme</text><circle cx="71.0" cy="482.5" r="7" fill="#a35d00"/><text x="95.0" y="486.5" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">l'humain décide : il répond, montre, valide, tranche, relit</text><rect x="63.0" y="498.5" width="16.0" height="16.0" rx="4" fill="#ecf4ec" stroke="#006300" stroke-width="1"/><text x="95.0" y="510.5" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">soutiens à la production : sur le code seulement, pendant /implementation, puis en CI/CD à chaque push et la nuit</text><rect x="59.0" y="523.5" width="24.0" height="14.0" rx="7" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1"/><text x="95.0" y="534.5" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">MCP : l'outil branché sur le skill (Jira, DSFR, Figma, Playwright)</text><text x="57.0" y="564.5" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start">Contexte commun à tous les skills : les standards de l'équipe (ticket, UX / UI, développement, sécurité), versionnés</text><text x="57.0" y="580.5" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start">dans le repo. Le détail skill par skill est dans la vue matrice.</text></svg>