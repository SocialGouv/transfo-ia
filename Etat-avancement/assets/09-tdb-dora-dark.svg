<svg xmlns="http://www.w3.org/2000/svg" width="920" height="628" viewBox="0 0 920 628" font-family="-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif"><rect x="0.5" y="0.5" width="919" height="627" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/><text x="32" y="40" font-size="15.5" fill="#ffffff" font-weight="600" text-anchor="start">Le tableau de bord, adossé à DORA</text><text x="32" y="61" font-size="12.5" fill="#c3c2b7" font-weight="normal" text-anchor="start">référentiel DevOps reconnu, complété de trois axes propres au contexte : coût, adoption IA, risque · lecture avant / après</text><text x="32" y="100" font-size="11" fill="#c3c2b7" font-weight="600" text-anchor="start">Axe</text><text x="118" y="100" font-size="11" fill="#c3c2b7" font-weight="600" text-anchor="start">Indicateur</text><text x="330" y="100" font-size="11" fill="#c3c2b7" font-weight="600" text-anchor="start">Mode de calcul</text><text x="648" y="100" font-size="11" fill="#c3c2b7" font-weight="600" text-anchor="start">Source</text><text x="796" y="100" font-size="11" fill="#c3c2b7" font-weight="600" text-anchor="start">Type de source</text><line x1="32" y1="112" x2="888" y2="112" stroke="#383835" stroke-width="1.5"/><text x="32" y="138" font-size="11.5" fill="#3987e5" font-weight="600" text-anchor="start">Vitesse</text><text x="118" y="138" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Cycle time</text><text x="330" y="138" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Délai issue → PR → prod,</text><text x="330" y="153" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">moyenne glissante (lead time DORA)</text><text x="648" y="138" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">GitHub / Jira</text><text x="796" y="138" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="160" x2="888" y2="160" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="182" font-size="11.5" fill="#3987e5" font-weight="600" text-anchor="start">Vitesse</text><text x="118" y="182" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Débit à effectif constant</text><text x="330" y="182" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Évolutions livrées / sprint,</text><text x="330" y="197" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">avant vs pendant</text><text x="648" y="182" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">GitHub / Jira (backlog)</text><text x="796" y="182" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="204" x2="888" y2="204" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="226" font-size="11.5" fill="#0ca30c" font-weight="600" text-anchor="start">Qualité</text><text x="118" y="226" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Régressions &amp; rétablissement</text><text x="330" y="226" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Bugs prod / tickets livrés,</text><text x="330" y="241" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">délai moyen de résolution (DORA)</text><text x="648" y="226" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Incidents + réclamations</text><text x="796" y="226" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="248" x2="888" y2="248" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="270" font-size="11.5" fill="#0ca30c" font-weight="600" text-anchor="start">Qualité</text><text x="118" y="270" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Couverture &amp; dette</text><text x="330" y="270" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Delta couverture de tests</text><text x="330" y="285" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">et dette technique</text><text x="648" y="270" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">SonarQube / CI</text><text x="796" y="270" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="292" x2="888" y2="292" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="314" font-size="11.5" fill="#0ca30c" font-weight="600" text-anchor="start">Qualité</text><text x="118" y="314" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Exhaustivité documentation</text><text x="330" y="314" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">% de repos avec doc à jour</text><text x="330" y="329" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">(README, ADR)</text><text x="648" y="314" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Audit des repos GitHub</text><text x="796" y="314" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="336" x2="888" y2="336" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="358" font-size="11.5" fill="#fab219" font-weight="600" text-anchor="start">Coût</text><text x="118" y="358" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Coût par fonctionnalité</text><text x="330" y="358" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Tokens consommés (Bedrock · Albert)</text><text x="330" y="373" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">+ temps de review / fonctionnalité</text><text x="648" y="358" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Facturation AWS · Albert</text><text x="648" y="373" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">+ Jira</text><text x="796" y="358" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="380" x2="888" y2="380" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="402" font-size="11.5" fill="#3987e5" font-weight="600" text-anchor="start">Adoption IA</text><text x="118" y="402" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Usage réel de l'IA</text><text x="330" y="402" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">% de devs actifs / jour sur les harness,</text><text x="330" y="417" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">tokens consommés par projet</text><text x="648" y="402" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Observabilité</text><text x="648" y="417" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Bedrock · Albert</text><text x="796" y="402" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><line x1="32" y1="424" x2="888" y2="424" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="446" font-size="11.5" fill="#3987e5" font-weight="600" text-anchor="start">Adoption IA</text><text x="118" y="446" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Maturité d'équipe (1 à 5)</text><text x="330" y="446" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Score par périmètre, à chaque jalon</text><text x="648" y="446" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Grille de maturité</text><text x="648" y="461" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">+ accompagnement</text><text x="796" y="446" font-size="11" fill="#3987e5" font-weight="600" text-anchor="start">Expertise</text><text x="796" y="461" font-size="11" fill="#3987e5" font-weight="600" text-anchor="start">structurée</text><line x1="32" y1="468" x2="888" y2="468" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="490" font-size="11.5" fill="#3987e5" font-weight="600" text-anchor="start">Adoption IA</text><text x="118" y="490" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Gain de temps perçu</text><text x="330" y="490" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Heures estimées / sem / dev,</text><text x="330" y="505" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">agrégées par équipe</text><text x="648" y="490" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Questionnaire court</text><text x="796" y="490" font-size="11" fill="#fab219" font-weight="600" text-anchor="start">Déclaratif</text><text x="796" y="505" font-size="11" fill="#fab219" font-weight="600" text-anchor="start">corroboratif</text><line x1="32" y1="512" x2="888" y2="512" stroke="#2c2c2a" stroke-width="1"/><text x="32" y="534" font-size="11.5" fill="#d03b3b" font-weight="600" text-anchor="start">Risque</text><text x="118" y="534" font-size="11.5" fill="#ffffff" font-weight="600" text-anchor="start">Conformité d'usage</text><text x="330" y="534" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">% d'usages cadrés par la charte,</text><text x="330" y="549" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">vs shadow IT</text><text x="648" y="534" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">Charte IA + audit</text><text x="648" y="549" font-size="11" fill="#c3c2b7" font-weight="normal" text-anchor="start">des accès</text><text x="796" y="534" font-size="11" fill="#0ca30c" font-weight="600" text-anchor="start">Outillé</text><text x="32" y="590" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start">DORA : fréquence de déploiement, lead time, taux d'échec des changements, temps de rétablissement.</text><text x="32" y="608" font-size="11.5" fill="#898781" font-weight="normal" text-anchor="start">Le tableau de bord vit en rétrospective bimensuelle pendant l'accompagnement, lu ensemble, équipe par équipe.</text></svg>